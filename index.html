<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colles de maths</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Accès : mot de passe demandé à l'ouverture (protection légère côté client) -->
<form id="login">
  <h1>Colles de maths</h1>
  <input id="pw" type="password" placeholder="Mot de passe" autofocus>
  <button class="primary">Entrer</button>
  <p id="err"></p>
</form>

<div id="app" hidden>
  <header>
    <h1>Colles</h1>
    <nav>
      <button data-act="nav" data-v="sheets">Fiches</button>
      <button data-act="nav" data-v="students">Élèves</button>
      <button data-act="nav" data-v="notes">Notes</button>
      <button data-act="nav" data-v="global">Vue globale</button>
      <button data-act="nav" data-v="sync">Synchro</button>
    </nav>
    <div class="row tools">
      <small id="sync-status"></small>
      <button data-act="colle" title="Mode colle (vue simplifiée)">Mode colle</button>
      <button data-act="theme" title="Mode sombre">Sombre</button>
      <button data-act="export" class="hc">Exporter</button>
      <button data-act="import" class="hc">Importer</button>
    </div>
  </header>
  <main id="main"></main>
</div>

<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="imp" accept=".json,application/json" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
